title: Algebraic Geometry in Madrid
description: A list of algebraic geometry conferences, workshops, and seminars in Madrid.
baseurl: "/madrid-ag"
url: "https://pedro-nunez.github.io"

# Used as site.time's timezone, so the upcoming/past split in
