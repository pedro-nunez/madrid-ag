# (YYYY-MM-DD). Optional fields: institution_abbreviated, seminar,
# seminar_url, url. Keep the full hosting name in institution;
# institution_abbreviated is an optional display name (e.g. ICMAT or UCM).
# All events take place in Madrid; no location field is needed.
# seminar_url links to the recurring series; url links to this talk.
# Supply a seminar name when providing seminar_url. Omit seminar for
# a standalone talk. Do not use meeting-only end or organized_by fields.
# Entries can appear in any order. The Events page combines these with
