<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    // Applies a stored light/dark choice (if any) before the page paints,
    // so returning visitors never see a flash of the wrong theme. Shares
    // localStorage with the main pedro-nunez.github.io site, since this
    // page lives at a path under the same origin, so a theme choice made
    // on either site carries over to the other automatically.
    (function () {
      var stored = localStorage.getItem("theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    })();
  </script>
  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/info-toggle.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/events-filter.js' | relative_url }}" defer></script>
</head>
<body{% if page.url == '/' %} class="events-page"{% endif %}>
  <div class="topbar">
    <a href="{{ '/' | relative_url }}" class="topbar-title">{{ site.title }}</a>
  </div>
  <div class="info-toggle-wrap">
    <button type="button" id="info-toggle" class="info-toggle" aria-expanded="false" aria-controls="info-popup" title="About this website" aria-label="About this website">&#9432;</button>
    <div id="info-popup" class="info-popup" hidden>
      <p>A list of algebraic geometry conferences, workshops, and seminars
      in Madrid.</p>
      <p>You can suggest an event through the Add Event button. Any
      help keeping this list up to date is appreciated!</p>
      <p class="info-popup-credit">&mdash; Maintained by
      <a href="https://pedro-nunez.github.io/">Pedro Núñez</a> &mdash;</p>
    </div>
  </div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  <div class="page-wrap">
    <main class="page-content">
      {{ content }}
    </main>
  </div>
  <div class="last-updated-bar">
    <p class="last-updated">Last updated in {{ site.time | date: "%B %Y" }}</p>
  </div>
</body>
</html>
